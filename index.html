<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laser Disintegrator</title>
  </head>
  <body>
    <div id="game">
      <div id="layout">
        <div id="lab-col">
          <div id="lab">
            <!-- pixi canvas mounts here -->
          </div>
          <div id="durability">
            <div class="dur-head">
              <span class="dur-label">Durability</span>
              <span id="dur-text">—</span>
            </div>
            <div class="dur-bar"><div id="dur-fill"></div></div>
          </div>
        </div>
        <div id="side-col">
          <div id="wallet-card">
            <img class="coin-icon" src="/images/coin.png" alt="coins" />
            <b id="coins">0</b>
          </div>
          <aside id="upgrades">
            <!-- Mobile-only grab/close handle for the bottom-sheet (hidden on desktop). -->
            <div id="sheet-handle"></div>
            <nav id="tabs">
              <button data-tab="laser" class="active">Laser</button>
              <button data-tab="coins">Coins</button>
              <button data-tab="objects">Relics</button>
            </nav>
            <div id="panel-laser" class="panel"></div>
            <div id="panel-coins" class="panel"></div>
            <div id="panel-objects" class="panel"></div>
          </aside>
        </div>
      </div>
      <!-- Mobile-only: bottom trigger bar that slides the upgrades sheet up, and
           the dimming backdrop behind it. Both are display:none on desktop. -->
      <button id="open-upgrades">Upgrades<span id="upg-badge"></span></button>
      <div id="sheet-backdrop"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
